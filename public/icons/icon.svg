<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Two iPad Air Hockey</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151c33"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="256" r="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="0.35" stop-color="#cfe9ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#4fd1ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- left iPad: bezel, then screen -->
  <rect x="56" y="84" width="196" height="344" rx="30" fill="#5a6aa6"/>
  <rect x="62" y="90" width="184" height="332" rx="24" fill="#1a2342"/>
  <!-- right iPad -->
  <rect x="260" y="84" width="196" height="344" rx="30" fill="#5a6aa6"/>
  <rect x="266" y="90" width="184" height="332" rx="24" fill="#1a2342"/>
  <!-- puck glow -->
  <circle cx="256" cy="256" r="104" fill="url(#glow)"/>
  <!-- orange mallet (left iPad) -->
  <circle cx="154" cy="340" r="50" fill="#c9501b"/>
  <circle cx="154" cy="340" r="43" fill="#ff7a45"/>
  <circle cx="154" cy="340" r="20" fill="#ffb08c"/>
  <!-- cyan mallet (right iPad) -->
  <circle cx="358" cy="172" r="50" fill="#1b94c4"/>
  <circle cx="358" cy="172" r="43" fill="#4fd1ff"/>
  <circle cx="358" cy="172" r="20" fill="#b4ecff"/>
  <!-- puck straddling the seam -->
  <circle cx="256" cy="256" r="38" fill="#ffffff"/>
  <circle cx="256" cy="256" r="26" fill="#d9e2f5"/>
</svg>
