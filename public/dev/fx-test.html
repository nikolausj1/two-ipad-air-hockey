<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>View / FX / Audio test</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; font-family: -apple-system, system-ui, sans-serif; }
    #rink { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #bar { position: fixed; top: 8px; left: 8px; z-index: 5; display: flex; flex-wrap: wrap; gap: 6px; max-width: 70vw; }
    #bar button[data-bt].on, #bar #b-cycle.on { background: #4fd1ff; color: #001018; border-color: transparent; }
    #bar button { font: inherit; font-size: 13px; font-weight: 600; color: #eef2ff; background: rgba(29,39,68,0.9); border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
    #bar button.on { background: #ff7a45; color: #1a0a00; border-color: transparent; }
    #info { position: fixed; right: 8px; top: 100px; text-align: right; z-index: 5; color: rgba(255,255,255,0.55); font-size: 11px; font-family: ui-monospace, monospace; white-space: pre; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="rink"></canvas>
  <div id="bar">
    <button data-role="host">host</button>
    <button data-role="guest">guest</button>
    <button data-role="solo" class="on">solo</button>
    <button id="players">players: bot</button>
    <button id="unlock">unlock audio</button>
    <button id="mute">mute: off</button>
    <button id="narrow">narrow goals</button>
    <button id="lat">latency: off</button>
    <button id="reuse">reuse snapshot: on</button>
    <button id="mode">mode: mines</button>
    <button id="sd">goal stage sd: 0</button>
    <button id="goalnow">trigger goal</button>
    <button data-phase="ready">ready</button>
    <button data-phase="countdown">countdown</button>
    <button data-phase="play">play</button>
    <button data-phase="goal">goal</button>
    <button data-phase="over">over</button>
    <button id="hold">hold phase: off</button>
    <button id="rdh">host ready: off</button>
    <button id="rdg">guest ready: off</button>
    <button id="held">held: off</button>
    <button id="calib">calibrating: off</button>
    <button id="evready">fire ready</button>
    <button id="evgo">fire go</button>
    <button id="destroy">destroy+render</button>
    <button id="replay">replay (last 2 s @ 0.5x)</button>
    <button id="diag">diag: off</button>
    <button id="pred">predicted: off</button>
    <button id="sv">sv: infer</button>
    <span id="bbar" style="display:contents">
      <button id="b-ih">host item: -</button>
      <button id="b-ig">guest item: -</button>
      <button data-bt="gh0">ghost on host</button>
      <button data-bt="gh1">ghost on guest</button>
      <button data-bt="sh0">shield host</button>
      <button data-bt="sh1">shield guest</button>
      <button data-bt="fz">freeze</button>
      <button data-bt="rk0">rocket armed host</button>
      <button data-bt="rk1">rocket armed guest</button>
      <button data-bt="sk0">shrink host</button>
      <button data-bt="sk1">shrink guest</button>
      <button data-fire="box">box</button>
      <button data-fire="boxspawn">boxspawn</button>
      <button data-fire="use">use</button>
      <button data-fire="rocket">rocket</button>
      <button data-fire="shieldhit">shieldhit</button>
      <button data-fire="thaw">thaw</button>
      <button data-fire="minedrop">minedrop</button>
      <button data-fire="mine">mine blast</button>
      <button id="b-cycle">box cycle: off</button>
    </span>
  </div>
  <div id="info"></div>

<script type="module">
import { createView } from '../view.js';
import { createFx } from '../fx.js';
import { createAudio } from '../audio.js';

const W = 820, H = 1100;
const G = +(new URLSearchParams(location.search).get('g') ?? 80); // seam gap (solo play uses 0)
const BOTTOM = 2 * H + G;
const cfgBase = { W, H, G, puckR: 28, malletR: 46, goalW: 300, target: 7 };
const canvas = document.getElementById('rink');
const audio = createAudio();
const info = document.getElementById('info');

let role = 'solo';
let players = 'bot';
let mode = 'mines';
let view = null;
let reuse = true;
let narrow = false;
let latencyOn = false;
let pointerWorld = null; // set by dragging, tests screenToWorld
let sdForce = 0; // 0 = natural (stage 0, then 1 for the last second), 1 = force sd=1 in goal phase
let diagOn = false;
let predicted = false;
let svForce = null;
const ITEMS = ['', 'rocket', 'shield', 'ghost', 'shrink', 'freeze', 'mine'];
const items = [0, 0]; // indexes into ITEMS
const bt = { sh: [0, 0], gh: [0, 0], sk: [0, 0], fz: 0, rk: [0, 0], mr: [46, 46] };
const boxes = [{ k: 'box', x: 250, y: 1350, r: 25, a: 1 }, { k: 'box', x: 570, y: 870, r: 25, a: 1 }];
const dropped = { k: 'mine', x: 400, y: 1500, r: 21, a: 1 };
let btnPress = null;
let boxCycle = false;
let lastCycle = 0;
let minePhaseT = 0; // null = omit snapshot.sv (view infers), else 'host' | 'guest'
const diag = { fps: 60, frameMs: 4.2, rtt: 18, jitter: 2.4, kind: 'p2p', seq: 0, drops: 0 }; // mutated in place
// Replay: a ring of the last 2 s of built snapshots (deep-enough copies) and the playback state.
const REPLAY_SPAN = 2000, REPLAY_SPEED = 0.5;
const recBuf = [];
let rp = null; // { frames, t0 (ms of first frame), dur, pos (ms, replay clock), idx, cur }
let guestLocal = null; // guest role: {x, y} world position passed as render()'s 4th argument

function makeView() {
  if (view && view.destroy) view.destroy();
  guestLocal = null;
  view = createView(canvas, role, { ...cfgBase, mode, players });
  audio.setPerspective(role);
}

// --- fake sim -----------------------------------------------------------------
const puck = { x: W / 2, y: BOTTOM / 2, vx: 380, vy: 900 };
const sc = [0, 0];
const MINES = [{ k: 'mine', x: 240, y: 700, r: 36, a: 1 }, { k: 'mine', x: 590, y: 1700, r: 36, a: 1 }, { k: 'bumper', x: 410, y: 1150, r: 40, a: 1 }, { k: 'bumper', x: 200, y: 1500, r: 34, a: 1 }];
let evq = [];
let t0 = performance.now();
let lastStep = t0;
let phase = 'ready';
let phaseEnd = Infinity;
const rd = [0, 0];
let held = false;
let calibrating = false;
let hold = false; // freeze the fake sim in the current phase (for screenshots)
let lg = null;
let wn = null;
let lastSec = -1;
let lastCount = 4;
let mineDisarm = -1e9;

function ev(k, x, y, s, by, item) { const e = { k, x, y, s }; if (by) e.by = by; if (item) e.item = item; evq.push(e); }

function setPhase(p, dur, now) { phase = p; phaseEnd = now + dur; if (p === 'ready') phaseEnd = Infinity; }

function step(now) {
  const dt = Math.min(0.05, (now - lastStep) / 1000);
  lastStep = now;
  // phases
  if (hold) { if (phase !== 'play') { phaseEnd = Math.max(phaseEnd, now + 1500); puck.x = W / 2; puck.y = lg === 'host' ? H * 0.5 : H + G + H * 0.5; puck.vx = puck.vy = 0; } else { puck.vx = puck.vy = 0; } return; }
  if (phase === 'ready') {
    puck.x = W / 2; puck.y = lg === 'host' ? H * 0.5 : H + G + H * 0.5; puck.vx = puck.vy = 0;
    if (rd[0] && rd[1]) { setPhase('countdown', 3000, now); lastCount = 4; }
  } else if (phase === 'countdown') {
    const left = Math.ceil((phaseEnd - now) / 1000);
    if (left !== lastCount && left >= 1) { lastCount = left; ev('countdown', W / 2, BOTTOM / 2, left); }
    puck.x = W / 2; puck.y = lg === 'host' ? H * 0.5 : H + G + H * 0.5; puck.vx = puck.vy = 0;
    if (now >= phaseEnd) { setPhase('play', 14000, now); puck.x = W / 2; puck.y = BOTTOM / 2; puck.vx = 300; puck.vy = lg === 'host' ? -900 : 900; ev('serve', puck.x, puck.y, 0.5); ev('go', puck.x, puck.y, 1); lastSec = -1; }
  } else if (phase === 'play') {
    puck.x += puck.vx * dt; puck.y += puck.vy * dt;
    if (puck.x < 28) { puck.x = 28; puck.vx = Math.abs(puck.vx); ev('wall', 28, puck.y, Math.min(1, Math.abs(puck.vx) / 1500)); }
    if (puck.x > W - 28) { puck.x = W - 28; puck.vx = -Math.abs(puck.vx); ev('wall', W - 28, puck.y, Math.min(1, Math.abs(puck.vx) / 1500)); }
    // end rails (bounce unless in mouth)
    const mouth = Math.abs(puck.x - W / 2) < (narrow ? 130 : 300) / 2;
    if (puck.y < 28 && !mouth) { puck.y = 28; puck.vy = Math.abs(puck.vy); ev('wall', puck.x, 28, 0.6); }
    if (puck.y > BOTTOM - 28 && !mouth) { puck.y = BOTTOM - 28; puck.vy = -Math.abs(puck.vy); ev('wall', puck.x, BOTTOM - 28, 0.6); }
    // scripted event every second
    const sec = Math.floor((now - t0) / 1000);
    if (sec !== lastSec) {
      lastSec = sec;
      const m = sec % 6;
      if (m === 0) { ev('hit', puck.x, puck.y, 0.3 + Math.random() * 0.7); puck.vx *= 1.1; puck.vy *= 1.1; }
      if (m === 1) ev('bumper', 410, 1150, 0.8);
      if (m === 2) { ev('mine', MINES[0].x, MINES[0].y, 1); mineDisarm = now; }
      if (m === 3) ev('hit', puck.x, puck.y, 1);
      if (m === 4) { ev('wall', 0, puck.y, 0.5); }
    }
    // goal: puck leaves through a mouth
    if (puck.y < -28 || puck.y > BOTTOM + 28) {
      const by = puck.y < 0 ? 'host' : 'guest';
      sc[by === 'host' ? 0 : 1]++;
      lg = by;
      ev('goal', puck.x, puck.y < 0 ? 0 : BOTTOM, 1, by);
      if (sc[0] >= 7 || sc[1] >= 7) { wn = sc[0] >= 7 ? 'host' : 'guest'; setPhase('over', 5000, now); ev('over', W / 2, BOTTOM / 2, 1); }
      else setPhase('goal', 1600, now);
      puck.x = W / 2; puck.y = by === 'host' ? H * 0.5 : H + G + H * 0.5; puck.vx = puck.vy = 0;
    }
    // speed cap + gentle friction
    const f = Math.pow(0.9, dt); puck.vx *= f; puck.vy *= f;
    if (Math.hypot(puck.vx, puck.vy) < 500) { puck.vx *= 1.04; puck.vy *= 1.04; }
    if (now - t0 > 200 && Math.random() < 0.006) { puck.vx += (Math.random() - 0.5) * 600; puck.vy += (Math.random() - 0.5) * 600; }
    // auto-goal after some time so the demo reaches goal/over: aim at the mouth
    if (now - lastGoalAim > 9000) { lastGoalAim = now; puck.x = W / 2; puck.vx = 0; puck.vy = Math.random() < 0.5 ? -2200 : 2200; puck.y = BOTTOM / 2; }
  } else if (phase === 'goal') {
    if (now >= phaseEnd) { setPhase('play', 14000, now); puck.vx = 300; puck.vy = lg === 'host' ? -900 : 900; ev('go', puck.x, puck.y, 1); lastSec = -1; }
  } else if (phase === 'over') {
    if (now >= phaseEnd) { sc[0] = sc[1] = 0; wn = null; lg = null; rd[0] = rd[1] = 0; syncRdButtons(); setPhase('ready', 0, now); }
  }
}
let lastGoalAim = performance.now();
const lagBuf = [];

const mallets = [W / 2, BOTTOM - H * 0.2, W / 2, H * 0.2];
// Goal phase lasts 1600 ms in the fake sim: stage 0 for the first 600 ms (tm counts the
// stage down to 0), then stage 1 (the serve countdown, tm 1 -> 0). The toggle forces sd=1
// from the start so the digit can be inspected.
function sdStage(now) {
  if (sdForce) return 1;
  return phaseEnd - now <= 1000 ? 1 : 0;
}
function build(now) {
  const t = now / 1000;
  // mallets wander; dragging overrides the local player's mallet
  const hx = W / 2 + Math.sin(t * 1.7) * 280, hy = BOTTOM - H * 0.2 + Math.cos(t * 1.1) * 150;
  const gx = W / 2 + Math.sin(t * 1.3 + 1) * 280, gy = H * 0.2 + Math.cos(t * 0.9) * 150;
  mallets[0] = hx; mallets[1] = hy; mallets[2] = gx; mallets[3] = gy;
  if (pointerWorld) {
    if (role === 'guest') {
      mallets[2] = pointerWorld[0]; mallets[3] = Math.min(H - 46, Math.max(46, pointerWorld[1]));
    }
    else { mallets[0] = pointerWorld[0]; mallets[1] = Math.min(BOTTOM - 46, Math.max(H + G + 46, pointerWorld[1])); }
  }
  const armedAge = now - mineDisarm;
  if (mode === 'battle' && boxCycle && now - lastCycle > 2500) {
    lastCycle = now;
    const b = boxes[0];
    if (b.a) { b.a = 0; ev('box', b.x, b.y, 1, 'host'); evq[evq.length - 1].item = ITEMS[1 + ((now / 2500) | 0) % 6]; items[0] = 1 + ((now / 2500) | 0) % 6; }
    else { b.a = 1; b.x = 150 + Math.random() * 500; b.y = 900 + Math.random() * 1200; ev('boxspawn', b.x, b.y, 1); }
  }
  dropped.a = ((now - minePhaseT) / 1000) % 6 > 1 ? 1 : 0;
  const ob = mode === 'battle' ? [boxes[0], boxes[1], dropped] : mode === 'mines' ? [
    { ...MINES[0], a: armedAge > 4000 ? 1 : 0 }, MINES[1], MINES[2], MINES[3],
  ] : mode === 'bumpers' ? [MINES[2], MINES[3]] : [];
  const left = Math.max(0, (phaseEnd - now) / 1000);
  const snap = {
    t: 's',
    p: [puck.x, puck.y, puck.vx, puck.vy],
    m: mallets.slice(),
    sc: sc.slice(),
    ph: phase,
    tm: phase === 'goal' ? (sdStage(now) === 1 ? Math.min(1, left) : Math.max(0, left - 1)) : left,
    sd: phase === 'goal' ? sdStage(now) : 0,
    lg, wn,
    ob,
    gw: narrow ? [130, 130] : [300, 300],
    rd: rd.slice(),
    ev: evq,
  };
  if (mode === 'battle') {
    snap.it = [ITEMS[items[0]], ITEMS[items[1]]];
    for (let i = 0; i < 2; i++) bt.mr[i] = bt.sk[i] > 0 ? 27.6 : 46;
    snap.bt = { sh: bt.sh.slice(), gh: bt.gh.slice(), sk: bt.sk.slice(), fz: bt.fz, rk: bt.rk.slice(), mr: bt.mr.slice() };
  }
  evq = [];
  return snap;
}

// --- loop ---------------------------------------------------------------------
let snap = null;
let lastBuild = 0;
let frames = 0, fpsT = performance.now(), fps = 0;
let manual = false; // scripted rendering from the console (screenshots of exact states)
function frame(now) {
  if (manual) { requestAnimationFrame(frame); return; }
  step(now);
  if (!snap || !reuse || now - lastBuild >= 16.6) {
    snap = build(now);
    lastBuild = now;
    audio.onEvents(snap.ev, snap);
    if (!rp) {
      recBuf.push({ t: now, s: { ...snap, p: snap.p.slice(), m: snap.m.slice(), sc: snap.sc.slice(), rd: snap.rd.slice(), gw: snap.gw.slice(), ev: snap.ev.map((e) => ({ ...e })) } });
      while (recBuf.length && recBuf[0].t < now - REPLAY_SPAN) recBuf.shift();
    }
  }
  // Guest: the dragged mallet is passed as the local prediction (4th arg) while the
  // snapshot copy is deliberately delayed ~80 ms, like Wi-Fi lag. Host/solo ignore it.
  let local = null;
  if (role === 'guest' && pointerWorld) {
    local = { x: pointerWorld[0], y: Math.min(H - 46, Math.max(46, pointerWorld[1])) };
    lagBuf.push({ t: now, x: local.x, y: local.y });
    while (lagBuf.length > 1 && lagBuf[1].t <= now - 80) lagBuf.shift();
    snap.m[2] = lagBuf[0].x; snap.m[3] = lagBuf[0].y;
  } else lagBuf.length = 0;
  // Replay playback: a fresh shallow copy of each recorded snapshot as it comes up,
  // exactly what main.js will do. The same copy is re-rendered until the next frame.
  let replayUi = null;
  let drawSnap = snap;
  if (rp) {
    rp.pos += (now - rp.last) * REPLAY_SPEED; rp.last = now;
    if (rp.freeze != null) rp.pos = Math.min(rp.dur - 1, rp.freeze * rp.dur); // screenshots: park at a progress
    if (rp.pos >= rp.dur) { rp = null; }
    else {
      let i = rp.idx;
      while (i + 1 < rp.frames.length && rp.frames[i + 1].t - rp.t0 <= rp.pos) i++;
      if (i !== rp.idx || !rp.cur) { rp.idx = i; rp.cur = { ...rp.frames[i].s }; }
      drawSnap = rp.cur; local = null;
      replayUi = { t: rp.pos / rp.dur, speed: REPLAY_SPEED };
    }
  }
  if (svForce) drawSnap = drawSnap === snap ? (snap.sv = svForce, snap) : Object.assign(drawSnap, { sv: svForce });
  if (diagOn) {
    diag.fps = fps || 60; diag.frameMs = 3.5 + 1.5 * Math.sin(now / 400) + (Math.random() < 0.02 ? 14 : 0);
    diag.rtt = 20 + 14 * Math.sin(now / 1300) + (Math.random() < 0.01 ? 90 : 0); diag.jitter = 2.5 + 2 * Math.abs(Math.sin(now / 900));
    diag.seq = (diag.seq + 1) % 100000; if (Math.random() < 0.004) diag.drops++;
  }
  view.render(drawSnap, 0, now, local, { held, calibrating, replay: replayUi, diag: diagOn ? diag : null, predicted, btnPress });
  frames++;
  if (now - fpsT > 500) { fps = Math.round(frames * 1000 / (now - fpsT)); frames = 0; fpsT = now; }
  info.textContent = `role=${role} players=${players} mode=${mode}  fps=${fps}  phase=${phase} sd=${snap.sd} rd=${rd.join('')} held=${+held} calib=${+calibrating}  score=${sc[0]}-${sc[1]}  audio.muted=${audio.muted}`;
  requestAnimationFrame(frame);
}

// --- UI -----------------------------------------------------------------------
for (const b of document.querySelectorAll('[data-role]')) {
  b.addEventListener('click', () => {
    role = b.dataset.role;
    for (const o of document.querySelectorAll('[data-role]')) o.classList.toggle('on', o === b);
    makeView();
  });
}
const $ = (id) => document.getElementById(id);
$('players').onclick = () => { players = players === 'bot' ? 'pass' : 'bot'; $('players').textContent = 'players: ' + players; makeView(); };
$('sd').onclick = () => { sdForce = sdForce ? 0 : 1; $('sd').textContent = 'goal stage sd: ' + (sdForce ? '1 (forced)' : 'auto'); $('sd').classList.toggle('on', !!sdForce); };
function syncRdButtons() { $('rdh').textContent = 'host ready: ' + (rd[0] ? 'on' : 'off'); $('rdh').classList.toggle('on', !!rd[0]); $('rdg').textContent = 'guest ready: ' + (rd[1] ? 'on' : 'off'); $('rdg').classList.toggle('on', !!rd[1]); }
function jump(p) {
  const now = performance.now();
  if (p === 'ready') { rd[0] = rd[1] = 0; syncRdButtons(); setPhase('ready', 0, now); }
  else if (p === 'countdown') { setPhase('countdown', 3000, now); lastCount = 4; if (hold) phaseEnd = now + 2400; }
  else if (p === 'play') { setPhase('play', 14000, now); puck.x = W / 2; puck.y = H + G + 700; puck.vx = 160; puck.vy = -700; }
  else if (p === 'goal') { lg = 'host'; sc[0] = Math.max(sc[0], 3); sc[1] = Math.max(sc[1], 2); setPhase('goal', 1600, now); ev('goal', W / 2, 0, 1, 'host'); }
  else if (p === 'over') { wn = 'host'; sc[0] = 7; sc[1] = 3; lg = 'host'; setPhase('over', 5000, now); ev('over', W / 2, BOTTOM / 2, 1); }
}
for (const b of document.querySelectorAll('[data-phase]')) b.addEventListener('click', () => jump(b.dataset.phase));
$('replay').onclick = () => startReplay();
$('diag').onclick = () => { diagOn = !diagOn; $('diag').textContent = 'diag: ' + (diagOn ? 'on' : 'off'); $('diag').classList.toggle('on', diagOn); };
$('pred').onclick = () => { predicted = !predicted; $('pred').textContent = 'predicted: ' + (predicted ? 'on' : 'off'); $('pred').classList.toggle('on', predicted); };
$('sv').onclick = () => { svForce = svForce === null ? 'host' : svForce === 'host' ? 'guest' : null; $('sv').textContent = 'sv: ' + (svForce || 'infer'); $('sv').classList.toggle('on', !!svForce); };
function startReplay() {
  if (rp || recBuf.length < 3) return;
  const frames = recBuf.slice();
  rp = { frames, t0: frames[0].t, dur: frames[frames.length - 1].t - frames[0].t, pos: 0, idx: 0, cur: null, last: performance.now() };
}
$('hold').onclick = () => { hold = !hold; $('hold').textContent = 'hold phase: ' + (hold ? 'on' : 'off'); $('hold').classList.toggle('on', hold); };
$('rdh').onclick = () => { rd[0] = rd[0] ? 0 : 1; if (rd[0]) ev('ready', 0, 0, 1, 'host'); syncRdButtons(); };
$('rdg').onclick = () => { rd[1] = rd[1] ? 0 : 1; if (rd[1]) ev('ready', 0, 0, 1, 'guest'); syncRdButtons(); };
$('held').onclick = () => { held = !held; $('held').textContent = 'held: ' + (held ? 'on' : 'off'); $('held').classList.toggle('on', held); };
$('calib').onclick = () => { calibrating = !calibrating; $('calib').textContent = 'calibrating: ' + (calibrating ? 'on' : 'off'); $('calib').classList.toggle('on', calibrating); };
$('evready').onclick = () => ev('ready', 0, 0, 1, role === 'guest' ? 'guest' : 'host');
$('evgo').onclick = () => ev('go', puck.x, puck.y, 1);
$('destroy').onclick = () => { const v = view; v.destroy(); let err = 'ok'; try { v.render(snap, 0, performance.now(), null, { held: true }); v.resize(); } catch (e) { err = String(e); } console.log('render after destroy:', err); $('destroy').textContent = 'after destroy: ' + err; makeView(); };
$('goalnow').onclick = () => { lg = 'host'; phase = 'goal'; phaseEnd = performance.now() + 1600; };
$('mode').onclick = () => { mode = mode === 'mines' ? 'bumpers' : mode === 'bumpers' ? 'ice' : mode === 'ice' ? 'classic' : mode === 'classic' ? 'battle' : 'mines'; $('mode').textContent = 'mode: ' + mode; makeView(); };
$('unlock').onclick = () => { audio.unlock(); evq.push({ k: 'hit', x: W / 2, y: BOTTOM / 2, s: 0.8 }); };
$('mute').onclick = () => { audio.setMuted(!audio.muted); $('mute').textContent = 'mute: ' + (audio.muted ? 'on' : 'off'); };
$('narrow').onclick = () => { narrow = !narrow; $('narrow').classList.toggle('on', narrow); };
$('lat').onclick = () => { latencyOn = !latencyOn; $('lat').textContent = 'latency: ' + (latencyOn ? 'on' : 'off'); view.setLatency(latencyOn ? 12 + Math.random() * 60 : null); };
$('reuse').onclick = () => { reuse = !reuse; $('reuse').textContent = 'reuse snapshot: ' + (reuse ? 'on' : 'off'); };
canvas.addEventListener('pointerdown', (e) => {
  const side = view.buttonAt(e.clientX, e.clientY);
